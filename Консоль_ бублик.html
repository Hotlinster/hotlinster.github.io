<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Консоль: бублик</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #000;
    --win: #000;
    --edge: #2a2a2a;
    --bar: #161616;
    --txt: #d8d8d8;
    --dim: #777;
    --ink: #e8c27a;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  html, body { margin: 0; background: var(--bg); height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "JetBrains Mono", "Cascadia Mono", Consolas, Menlo, "DejaVu Sans Mono", monospace;
    color: var(--txt);
  }
  .term {
    width: min(94vw, 760px);
    background: var(--win);
    border: 1px solid var(--edge);
    border-radius: 8px;
    overflow: hidden;
  }
  .bar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; background: var(--bar);
    border-bottom: 1px solid var(--edge);
    font-size: 12px; color: var(--dim);
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #3a3a3a; }
  .body { padding: 14px 16px 16px; font-size: 13px; line-height: 1.4; }
  .cmd .p { color: #6fd08c; }
  pre#d {
    margin: 10px 0 8px; color: var(--ink);
    font: inherit; font-size: clamp(7px, 1.9vw, 12px); line-height: 1.02;
    letter-spacing: 0; white-space: pre; overflow: hidden;
    text-align: center;
  }
  .cur { display: inline-block; width: .6em; height: 1.1em; background: var(--txt);
         vertical-align: -2px; animation: b 1s steps(1) infinite; }
  @keyframes b { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cur { animation: none; } }
</style>
</head>
<body>
<div class="term" role="img" aria-label="Вращающийся трёхмерный бублик в чёрной консоли">
  <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span>bash — donut</span></div>
  <div class="body">
    <div class="cmd"><span class="p">user@donut:~$</span> ./donut --spin</div>
    <pre id="d"></pre>
    <div class="cmd"><span class="p">user@donut:~$</span> <span class="cur"></span></div>
  </div>
</div>
<script>
(function () {
  var W = 80, H = 40;
  var el = document.getElementById("d");
  var chars = ".,-~:;=!*#$@";
  var A = 0, B = 0;
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function frame() {
    var b = new Array(W * H).fill(" ");
    var z = new Array(W * H).fill(0);
    var cA = Math.cos(A), sA = Math.sin(A), cB = Math.cos(B), sB = Math.sin(B);
    for (var j = 0; j < 6.28; j += 0.07) {
      var ct = Math.cos(j), st = Math.sin(j);
      for (var i = 0; i < 6.28; i += 0.02) {
        var sp = Math.sin(i), cp = Math.cos(i);
        var h = ct + 2;
        var D = 1 / (sp * h * sA + st * cA + 5);
        var t = sp * h * cA - st * sA;
        var x = Math.floor(W / 2 + 30 * D * (cp * h * cB - t * sB));
        var y = Math.floor(H / 2 + 15 * D * (cp * h * sB + t * cB));
        var o = x + W * y;
        var N = Math.floor(8 * ((st * sA - sp * ct * cA) * cB - sp * ct * sA - st * cA - cp * ct * sB));
        if (y >= 0 && y < H && x >= 0 && x < W && D > z[o]) {
          z[o] = D;
          b[o] = chars[N > 0 ? Math.min(N, 11) : 0];
        }
      }
    }
    var out = "";
    for (var k = 0; k < W * H; k++) {
      out += b[k];
      if ((k + 1) % W === 0) out += "\n";
    }
    el.textContent = out;
  }

  function loop() {
    frame();
    A += 0.04; B += 0.02;
    requestAnimationFrame(loop);
  }
  if (reduce) { A = 1; B = 0.6; frame(); } else { loop(); }
})();
</script>
</body>
</html>
